[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tailrisk"
version = "0.0.1"
description = "변동성 레짐 조기경보와 리스크 타겟팅 자산배분 실험"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "yfinance>=0.2.40",
]

[project.optional-dependencies]
ml = ["scikit-learn", "lightgbm", "arch", "mlflow"]
viz = ["matplotlib"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
